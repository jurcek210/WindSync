name: Build and Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'splet/backend/**'
      - '.github/workflows/backend-docker-image.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v3

      - name: Prikaz datotek v ./splet/backend
        run: |
          ls -la ./splet/backend
          echo "--- VSE DATOTEKE (rekurzivno) ---"
          find ./splet/backend
      
      - name: Izpiši vsebino direktorija
        run: ls -la ./splet/backend && find ./splet/backend

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./splet/backend
          push: true
          no-cache: true
          tags: jurcek321/windsync-backend:latest
              
      - name: Izpiši vsebino Docker slike
        run: |
          docker build -t debug-backend ./splet/backend
          docker run --rm debug-backend ls -la

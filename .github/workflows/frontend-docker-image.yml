name: Build and Deploy Frontend

on:
  push:
    branches:
      - dev
    paths:
      - 'splet/frontend/**'
      - '.github/workflows/frontend-docker-image.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v3

      - name: Prikaz datotek v ./splet/frontend
        run: |
          ls -la ./splet/frontend
          echo "--- VSE DATOTEKE (rekurzivno) ---"
          find ./splet/frontend

      - name: Izpiši vsebino direktorija
        run: ls -la ./splet/frontend && find ./splet/frontend

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./splet/frontend
          push: true
          no-cache: true
          tags: jurcek321/windsync-frontend:latest

      - name: Izpiši vsebino Docker slike
        run: |
          docker build -t debug-frontend ./splet/frontend
          docker run --rm debug-frontend ls -la
